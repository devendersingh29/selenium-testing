[pytest]
testpaths = Tests
python_files = test_*.py
python_functions = test_*
#addopts = -ra -q --maxfail=1 --browser=chromium
markers =
    playwright: tests that use Playwright fixtures and browsers
    ui: browser-based user interface tests
    smoke: critical-path checks suitable for a quick build validation
    regression: broader tests used to detect regressions across the application
    e2e: end-to-end workflows spanning multiple pages or features
    read_only: tests that validate the UI without changing application data
    data_mutation: tests that create, edit, submit, or otherwise change application data
    authentication: sign-in and authentication workflow tests
    signup: organization sign-up workflow tests
    welcome: welcome page tests
    admin: administrator workflow tests
    client: client management tests
    manager: manager management tests
    panel: interview panel management tests
    recruiter: recruiter management tests
    vendor: vendor management tests
    job_opening: job-opening management tests
    create: entity or job-opening creation tests
    draft: draft job-opening tests
    edit: entity or job-opening editing tests
    search: search and result-filtering tests
    schedule: job-opening scheduling tests
    shortlisted_profiles: shortlisted-profile count and display tests
    submission: job-opening submission tests
    view_toggle: list/grid view toggle tests
    form: form visibility, field, label, and input tests
    sample: example or framework-validation tests

addopts =
    --html=Reports/Test_Report.html
    --self-contained-html
    --alluredir=Reports/allure-results
    --junitxml=Reports/junit/test-results.xml
    --strict-markers

junit_family = xunit2
